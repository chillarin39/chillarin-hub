<!--
  Chillarin UI Kit — mode toggle button HTML
  ヘッダーやナビゲーション右端に置く。
  base.css のスタイルがそのまま当たる。
-->
<button type="button" class="mode-toggle" aria-label="カラーモード切替" aria-pressed="false">
  <span class="mode-toggle__track">
    <svg class="mode-toggle__icon mode-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
        <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
        <line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/>
        <line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/>
      </g>
    </svg>
    <svg class="mode-toggle__icon mode-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 15A8 8 0 1 1 9 4a7 7 0 0 0 11 11z" fill="currentColor"/>
    </svg>
    <span class="mode-toggle__thumb" aria-hidden="true"></span>
  </span>
</button>
